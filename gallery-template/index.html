<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGBOOTH - Kỷ niệm của bạn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <header class="w-full bg-white shadow-sm p-4 text-center sticky top-0 z-10">
        <h1 class="text-2xl font-black tracking-widest text-black">CG<span class="text-green-400">BOOTH</span></h1>
        <p class="text-xs text-gray-400 mt-1 uppercase font-bold tracking-widest">Lưu giữ khoảnh khắc</p>
    </header>

    <main class="w-full max-w-md mx-auto p-4 flex flex-col gap-8">
        
        <div id="loading" class="flex flex-col items-center justify-center py-20 text-gray-400">
            <i class="fas fa-circle-notch fa-spin text-4xl mb-4 text-green-400"></i>
            <p class="text-sm uppercase tracking-widest font-bold">Đang tải kỷ niệm...</p>
        </div>

        <div id="error" class="hidden flex-col items-center justify-center py-20 text-red-400 text-center">
            <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
            <p class="text-sm font-bold">Không tìm thấy dữ liệu.</p>
        </div>

        <!-- Content Area -->
        <div id="content" class="hidden flex-col gap-8">
            
            <!-- Final Frame Section (Lên Đầu) -->
            <section id="section-final" class="hidden bg-white p-4 rounded-2xl shadow-sm">
                <h2 class="text-sm font-black text-gray-400 uppercase tracking-widest mb-3"><i class="fas fa-image text-green-400 mr-2"></i>Ảnh Frame</h2>
                <div class="rounded-xl overflow-hidden shadow-inner bg-gray-100 mb-3 p-2 flex justify-center">
                    <img id="final-img" class="max-h-[60vh] object-contain drop-shadow-md rounded" onerror="this.src='https://placehold.co/400x600/f3f4f6/a1a1aa?text=Frame+Hoan+Chinh'" />
                </div>
                <button id="btn-dl-final" class="w-full bg-black text-white font-bold uppercase py-3 rounded-xl hover:bg-gray-800 active:scale-95 transition-all">
                    LƯU ẢNH GHÉP
                </button>
            </section>

            <!-- Video Section -->
            <section id="section-video" class="hidden bg-white p-4 rounded-2xl shadow-sm">
                <h2 class="text-sm font-black text-gray-400 uppercase tracking-widest mb-3"><i class="fas fa-video text-green-400 mr-2"></i>Video Hậu Trường</h2>
                <div class="rounded-xl overflow-hidden bg-black mb-3 aspect-video flex justify-center items-center">
                    <video id="video-player" class="w-full h-full object-cover" autoplay loop muted playsinline controls></video>
                    <p id="video-placeholder" class="text-white/50 text-xs uppercase tracking-widest hidden">Video Hậu Trường</p>
                </div>
                <button id="btn-dl-video" class="w-full bg-black text-white font-bold uppercase py-3 rounded-xl hover:bg-gray-800 active:scale-95 transition-all">
                    LƯU VIDEO
                </button>
            </section>

            <!-- Raw Photos Section -->
            <section id="section-raw" class="hidden bg-white p-4 rounded-2xl shadow-sm">
                <h2 class="text-sm font-black text-gray-400 uppercase tracking-widest mb-3"><i class="fas fa-layer-group text-green-400 mr-2"></i>Ảnh Gốc</h2>
                <div id="raw-grid" class="grid grid-cols-2 gap-2 mb-3">
                    <!-- Raw photos will be inserted here -->
                </div>
            </section>

        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('id');

        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');

        const downloadFile = async (url, filename, btn) => {
            const ogText = btn.innerHTML;
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => btn.innerHTML = ogText, 2000);
            } catch (e) {
                window.open(url, '_blank');
                btn.innerHTML = ogText;
            }
        };

        if (sessionId) {
            // Tắt loading
            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');

            const sessionUrl = window.location.origin + '/session/' + sessionId;

            // Ảnh hoàn chỉnh (Frame)
            document.getElementById('section-final').classList.remove('hidden');
            const finalImg = document.getElementById('final-img');
            const finalUrl = sessionId === 'mock' ? 'https://placehold.co/800x1200/f3f4f6/a1a1aa?text=Anh+Hoan+Chinh' : `${sessionUrl}/final_strip.jpg`;
            finalImg.src = finalUrl;
            document.getElementById('btn-dl-final').addEventListener('click', function() {
                downloadFile(finalUrl, `cgbooth-frame-${Date.now()}.jpg`, this);
            });

            // Video
            document.getElementById('section-video').classList.remove('hidden');
            const videoUrl = sessionId === 'mock' ? 'https://www.w3schools.com/html/mov_bbb.mp4' : `${sessionUrl}/bts_video.webm`;
            const videoEl = document.getElementById('video-player');
            
            if (sessionId === 'mock') {
                videoEl.classList.add('hidden');
                document.getElementById('video-placeholder').classList.remove('hidden');
            } else {
                videoEl.src = videoUrl;
            }

            document.getElementById('btn-dl-video').addEventListener('click', function() {
                downloadFile(videoUrl, `cgbooth-video-${Date.now()}.webm`, this);
            });

            // Ảnh Raw (4 tấm)
            document.getElementById('section-raw').classList.remove('hidden');
            const grid = document.getElementById('raw-grid');
            for (let i = 1; i <= 4; i++) {
                const rawUrl = sessionId === 'mock' ? `https://placehold.co/300x400/f3f4f6/a1a1aa?text=Anh+Raw+${i}` : `${sessionUrl}/raw_photo_${i}.jpg`;
                const div = document.createElement('div');
                div.className = "relative rounded-lg overflow-hidden border border-gray-200 aspect-[3/4] bg-gray-100";
                div.innerHTML = `
                    <img src="${rawUrl}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                    <button class="absolute bottom-2 right-2 bg-black/70 backdrop-blur text-white p-2 rounded-full w-10 h-10 flex justify-center items-center hover:bg-black active:scale-95 transition-all">
                        <i class="fas fa-download"></i>
                    </button>
                `;
                div.querySelector('button').addEventListener('click', function() {
                    downloadFile(rawUrl, `cgbooth-raw-${i}-${Date.now()}.jpg`, this);
                });
                grid.appendChild(div);
            }
        } else {
            loadingEl.classList.add('hidden');
            errorEl.classList.remove('hidden');
            errorEl.classList.add('flex');
        }
    </script>
</body>
</html>
