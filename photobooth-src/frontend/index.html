<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Photobooth</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    
    #videoElement {
      width: 1280px;
      height: 720px;
      background-color: #000;
      border: 4px solid #333;
      border-radius: 12px;
      object-fit: cover;
      transform: scaleX(-1); /* Gương */
    }

    .ui-container {
      position: absolute;
      bottom: 50px;
      text-align: center;
      width: 100%;
    }

    button {
      padding: 20px 60px;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
      transition: transform 0.2s;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
      box-shadow: none;
    }

    #countdownOverlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 250px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: none;
    }

    #resultContainer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      display: none;
      z-index: 10;
    }

    #resultImage {
      max-width: 80%;
      max-height: 80%;
      border: 10px solid white;
      box-shadow: 0 0 50px rgba(255,255,255,0.2);
    }

    .close-btn {
      margin-top: 30px;
      background: white;
      color: black;
    }
  </style>
</head>
<body>

  <video id="videoElement" autoplay playsinline></video>
  <div id="countdownOverlay">3</div>

  <div class="ui-container">
    <button id="captureBtn">BẮT ĐẦU CHỤP</button>
  </div>

  <div id="resultContainer">
    <img id="resultImage" src="" alt="Ảnh thành phẩm">
    <button class="close-btn" id="closeResultBtn">CHỤP LẠI</button>
  </div>

  <script src="./dist/renderer.js"></script>
</body>
</html>
