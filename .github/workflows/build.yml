name: Build NeoBooth Setup

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: npm run package

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeoBooth-Setup
          path: release/*.exe
          retention-days: 30
